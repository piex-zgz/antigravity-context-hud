  <path d="M 64 24 A 40 40 0 0 1 96.5 40" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  <path d="M 96.5 40 A 40 40 0 0 1 102 74" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="64" y1="68" x2="84" y2="44" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="8" fill="#0EA5E9"/>
  <!-- Mini MRI pulse wave at bottom -->
  <polyline points="38,96 50,96 56,86 64,102 72,90 78,96 90,96" stroke="#0EA5E9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
