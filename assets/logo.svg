  <circle cx="64" cy="64" r="46" stroke="#64748B" stroke-opacity="0.28" stroke-width="6"/>
  <!-- Gauge background arc (240 deg sweep) -->
  <path d="M 31.5 87 A 40 40 0 1 1 96.5 87" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <!-- Green -> Amber -> Red segmented fill -->
