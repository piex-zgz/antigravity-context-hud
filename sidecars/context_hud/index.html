<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Context HUD</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="tabs" role="tablist" aria-label="视图切换">
        <button class="tab active" data-tab="hud" role="tab" aria-selected="true">实时水位</button>
        <button class="tab" data-tab="mri" role="tab" aria-selected="false">轨迹体检</button>
      </div>
      <div class="topbar-right">
        <span id="live-dot" class="live-dot" title="自动刷新中"></span>
        <button id="refresh-btn" class="icon-btn" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
      </div>
    </header>

    <main id="panel-hud" class="panel" role="tabpanel">
      <div id="hud-root" class="stack">
        <div class="empty-card">正在读取当前会话水位…</div>
      </div>
    </main>

    <main id="panel-mri" class="panel hidden" role="tabpanel">
      <div id="mri-root" class="stack">
        <div class="empty-card">点击或切换到此页开始扫描本地主会话轨迹…</div>
      </div>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
